<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>raynodon</title>
    <link rel="icon" type="image/gif" href="avatar.gif">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('bg.jpg');
            background-size: cover; background-position: center; background-attachment: fixed;
            background-color: #0a0a0a; color: #eee; margin: 0;
            padding: 65px 20px 20px 20px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        body.no-banner { padding-top: 20px; }
        .container { max-width: 600px; width: 100%; position: relative; z-index: 2; }

        .tide-banner {
            position: fixed; top: 0; left: 0; width: 100%; height: 45px;
            background: linear-gradient(90deg, rgba(30, 50, 70, 0.98), rgba(0, 150, 160, 0.98), rgba(30, 50, 70, 0.98));
            background-size: 200% 100%;
            border-bottom: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 4px 15px rgba(0, 150, 160, 0.4);
            z-index: 2000; display: flex; align-items: center; overflow: hidden;
            animation: tideFlow 8s ease-in-out infinite alternate;
        }
        .tide-track { display: flex; white-space: nowrap; animation: marquee 25s linear infinite; }
        .tide-track:hover { animation-play-state: paused; }
        .tide-track a {
            color: #fff; text-decoration: none; font-size: 13px;
            letter-spacing: 5px; font-weight: bold; padding-right: 50px; transition: 0.3s;
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
        }
        .tide-track a:hover { text-shadow: 0 0 20px #fff, 0 0 30px #fff; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        @keyframes tideFlow { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }

        @keyframes fadeInSlideSide { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
        .side-commission {
            position: fixed; right: 30px; top: 100px; width: 180px; padding: 20px;
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.9), rgba(124, 58, 237, 0.9));
            border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 1000;
            animation: fadeInSlideSide 1s ease-out;
        }
        body.no-banner .side-commission { top: 60px; }

        .section { margin-bottom: 20px; padding: 25px; border-radius: 18px; background: rgba(15, 15, 15, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); }
        .section h3 { margin: 0 0 15px 0; font-size: 1.3rem; }
        .section .text { color: #ccc; font-size: 0.9rem; line-height: 1.7; white-space: pre-line; margin: 0 0 12px 0; }
        .mini-section { padding: 15px 25px; margin-bottom: 20px; border-radius: 15px; background: rgba(144, 19, 254, 0.15); border: 1px solid rgba(144, 19, 254, 0.3); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

        .profile-header { display: flex; align-items: center; gap: 20px; }
        .avatar { width: 90px; height: 90px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.2); object-fit: cover; box-shadow: 0 5px 15px rgba(0,0,0,0.4); flex-shrink: 0; }
        h1 { font-size: 2.5rem; margin: 0; color: #fff; line-height: 1.1; text-shadow: 0 0 15px #7c3aed; animation: glow 2s infinite alternate; }
        @keyframes glow { from { opacity: 0.85; } to { opacity: 1; text-shadow: 0 0 20px #fff, 0 0 40px #7c3aed; } }
        .about { color: #ccc; font-size: 0.9rem; line-height: 1.7; white-space: pre-line; margin: 18px 0 0 0; }

        .sns-icons { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 18px; font-size: 1.4rem; }
        .sns-icons a { color: rgba(255,255,255,0.7); text-decoration: none; transition: 0.3s; }
        .sns-icons a:hover { color: #fff; transform: scale(1.15); }
        .sns-icons img { height: 1.4rem; width: auto; vertical-align: middle; }

        .lang-nav { text-align: right; margin-bottom: 15px; }
        .lang-nav button { color: #888; border: 1px solid #444; padding: 4px 12px; border-radius: 20px; background: #000; cursor: pointer; margin-left: 8px; font-size: 11px; transition: 0.3s; }
        .lang-nav button:hover, .lang-nav button.active { color: #fff; border-color: #fff; background: rgba(255,255,255,0.1); }

        .btn { display: inline-block; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 13px; transition: 0.3s; cursor: pointer; }
        .btn-outline { border: 1px solid rgba(255,255,255,0.3); color: #fff; margin-top: 5px; margin-right: 5px; display: inline-flex; align-items: center; justify-content: center; }
        .btn-outline:hover { background: rgba(255,255,255,0.08); }
        .btn-compact { padding: 6px 12px; font-size: 11px; border-radius: 6px; }
        .btn-compact i { margin-right: 4px; font-size: 13px; }
        .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
        .custom-icon { height: 14px; width: auto; margin-right: 6px; border-radius: 2px; }
        .video { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; background: #000; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.4); }
        .video iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        /* Linktree 式的大按钮 */
        .link-tree { display: flex; flex-direction: column; gap: 10px; }
        .link-tree a {
            display: flex; align-items: center; gap: 14px; padding: 14px 18px;
            border-radius: 12px; border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.04); color: #fff; text-decoration: none;
            font-weight: bold; font-size: 0.95rem; transition: 0.25s;
        }
        .link-tree a:hover { background: rgba(124,58,237,0.25); border-color: rgba(124,58,237,0.7); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(124,58,237,0.25); }
        .link-tree .lt-icon { width: 24px; display: flex; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
        .link-tree .lt-icon img { height: 20px; width: auto; border-radius: 3px; }
        .link-tree .lt-label { flex: 1; text-align: center; }
        .link-tree .lt-arrow { width: 24px; text-align: right; opacity: 0.4; font-size: 0.8rem; transition: 0.25s; }
        .link-tree a:hover .lt-arrow { opacity: 1; transform: translateX(3px); }

        /* 试听侧边栏：贴在屏幕左边，点把手展开 / 收起 */
        .player {
            position: fixed; left: 0; top: 45px; bottom: 0; width: 340px; max-width: 85vw; z-index: 1500;
            display: flex; flex-direction: column;
            background: rgba(10,12,16,0.92); border-right: 1px solid rgba(0,150,160,0.5); backdrop-filter: blur(14px);
            box-shadow: 6px 0 30px rgba(0,0,0,0.5), 0 0 25px rgba(0,150,160,0.15);
            transform: translateX(0); transition: transform 0.4s cubic-bezier(.2,.8,.2,1);
        }
        body.no-banner .player { top: 0; }
        .player.closed { transform: translateX(-100%); box-shadow: none; }
        .player-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 12px; font-size: 0.95rem; font-weight: bold; letter-spacing: 1px; }
        .player-head i { color: #00c2cc; margin-right: 8px; }
        .player-close { background: none; border: 0; color: #aaa; cursor: pointer; font-size: 1rem; padding: 4px; }
        .player-close:hover { color: #fff; }
        .player-body { flex: 1; padding: 0 14px 14px; min-height: 0; }
        .player iframe { display: block; width: 100%; height: 100%; border: 0; border-radius: 12px; }

        /* 把手：贴在侧边栏右边缘，收起时露在屏幕左侧 */
        .player-handle {
            position: absolute; left: 100%; top: 50%; transform: translateY(-50%);
            writing-mode: vertical-rl; padding: 16px 8px; cursor: pointer;
            background: linear-gradient(180deg, rgba(30,50,70,0.98), rgba(0,150,160,0.98));
            color: #fff; border: 1px solid rgba(255,255,255,0.25); border-left: 0; border-radius: 0 12px 12px 0;
            font-size: 12px; font-weight: bold; letter-spacing: 3px;
            box-shadow: 4px 0 15px rgba(0,150,160,0.35);
        }
        .player-handle i { writing-mode: horizontal-tb; margin-bottom: 8px; }
        .player-handle:hover { box-shadow: 4px 0 25px rgba(0,150,160,0.7); }

        @media (max-width: 1000px) { .side-commission { position: relative; right: 0; top: 0 !important; width: auto; margin-bottom: 20px; box-sizing: border-box; } }
    </style>
</head>
<body>
<!--
  这个页面的内容全部来自 content.json。
  想改文字、链接、加新板块：用 editor.html 编辑，或直接改 content.json。
  一般不需要动这个文件。
-->
<div id="banner"></div>
<div class="container">
    <div class="lang-nav">
        <button data-lang="en">EN</button>
        <button data-lang="zh">CN</button>
        <button data-lang="ja">JP</button>
    </div>
    <div id="side"></div>
    <div id="main"></div>
</div>
<div id="playerSlot"></div>

<script>
let DATA = null;
let LANG = 'en';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 取当前语言的文字，空着的话依次退回英文、中文、日文
const t = v => {
    if (v == null) return '';
    if (typeof v === 'string') return v;
    return v[LANG] || v.en || v.zh || v.ja || '';
};
const iconHtml = (item, cls) => {
    if (item.image) return `<img src="${esc(item.image)}" alt="" class="${cls || ''}" onerror="this.style.display='none'">`;
    if (item.icon) return `<i class="${esc(item.icon)}"></i>`;
    return '';
};
const linkBtn = l => `<a href="${esc(l.url)}" target="_blank" rel="noopener" class="btn btn-outline btn-compact">${iconHtml(l, 'custom-icon')}${esc(t(l.label))}</a>`;

function render() {
    const d = DATA;
    document.title = d.name || 'raynodon';
    document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : LANG;

    // 顶部横幅
    const b = d.banner || {};
    const showBanner = b.show && t(b.text);
    document.body.classList.toggle('no-banner', !showBanner);
    document.getElementById('banner').innerHTML = showBanner ? `
        <div class="tide-banner"><div class="tide-track">
            <a href="${esc(b.url)}" target="_blank" rel="noopener">${esc(t(b.text))}</a>
            <a href="${esc(b.url)}" target="_blank" rel="noopener">${esc(t(b.text))}</a>
        </div></div>` : '';

    // 侧边委托卡片
    const c = d.commission || {};
    document.getElementById('side').innerHTML = c.show ? `
        <div class="side-commission">
            <h2 style="font-size: 1rem; margin: 0 0 5px 0;">${esc(t(c.title))}</h2>
            <p style="font-size: 0.8rem; margin-bottom: 15px; opacity: 0.9; white-space: pre-line;">${esc(t(c.desc))}</p>
            ${c.email ? `<a href="mailto:${esc(c.email)}" style="background:#fff; color:#000; width:100%; text-align:center; box-sizing:border-box;" class="btn">${esc(t(c.button))}</a>
            <span style="font-size: 0.75rem; display:block; text-align:center; margin-top:10px; color:#fff; opacity:0.8;">${esc(c.email)}</span>` : ''}
        </div>` : '';

    let html = '';

    // 个人资料
    html += `
        <div class="section">
            <div class="profile-header">
                <img src="${esc(d.avatar)}" alt="${esc(d.name)}" class="avatar" onerror="this.src='bg.jpg'">
                <div>
                    <h1>${esc(d.name)}</h1>
                    <p style="color:#aaa; margin: 4px 0; font-size: 0.9rem;">${esc(t(d.role))}</p>
                    <div class="sns-icons">
                        ${(d.sns || []).filter(s => s.url).map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener" title="${esc(s.title || '')}">${iconHtml(s)}</a>`).join('')}
                    </div>
                </div>
            </div>
            ${t(d.about) ? `<p class="about">${esc(t(d.about))}</p>` : ''}
        </div>`;

    // 赞助
    const sp = d.support || {};
    if (sp.show && (sp.links || []).length) {
        html += `
        <div class="mini-section">
            <span style="font-size: 0.9rem; font-weight:bold;">${esc(t(sp.label))}</span>
            <span class="btn-row">${sp.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener" class="btn btn-outline" style="margin:0; border-color:#9013fe;">${iconHtml(l, 'custom-icon')}${esc(t(l.label))}</a>`).join('')}</span>
        </div>`;
    }

    // 音乐：Linktree 式入口
    const m = d.music || {};
    const treeLink = l => `
        <a href="${esc(l.url)}" target="_blank" rel="noopener">
            <span class="lt-icon">${iconHtml(l)}</span>
            <span class="lt-label">${esc(t(l.label))}</span>
            <span class="lt-arrow"><i class="fa-solid fa-chevron-right"></i></span>
        </a>`;
    html += `
        <div class="section">
            <h3>${esc(t(m.title))}</h3>
            <div class="link-tree">${(m.links || []).filter(l => l.url).map(treeLink).join('')}</div>
            ${m.youtubePlaylist ? `<div class="video" style="margin: 20px 0 0 0;"><iframe src="https://www.youtube.com/embed/videoseries?list=${encodeURIComponent(m.youtubePlaylist)}" allowfullscreen></iframe></div>` : ''}
        </div>`;


    // 自定义板块
    (d.sections || []).forEach(s => {
        html += `
        <div class="section">
            ${t(s.title) ? `<h3>${esc(t(s.title))}</h3>` : ''}
            ${t(s.text) ? `<p class="text">${esc(t(s.text))}</p>` : ''}
            ${(s.links || []).length ? `<div class="btn-row">${s.links.map(linkBtn).join('')}</div>` : ''}
        </div>`;
    });

    document.getElementById('main').innerHTML = html;
    renderPlayer();
    document.querySelectorAll('.lang-nav button').forEach(btn => btn.classList.toggle('active', btn.dataset.lang === LANG));
}

// 把普通的分享链接转成可嵌入的播放器地址
function toEmbed(url) {
    url = String(url || '').trim();
    if (!url) return '';
    let m = url.match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?(?:embed\/)?(artist|album|track|playlist)\/([A-Za-z0-9]+)/);
    if (m) return `https://open.spotify.com/embed/${m[1]}/${m[2]}?utm_source=generator&theme=0`;
    if (/\/\/music\.apple\.com\//.test(url)) return url.replace('//music.apple.com/', '//embed.music.apple.com/');
    m = url.match(/music\.163\.com\/.*?(song|playlist|album)\?id=(\d+)/);
    if (m) return `https://music.163.com/outchain/player?type=${{ song: 2, playlist: 0, album: 1 }[m[1]]}&id=${m[2]}&auto=0&height=430`;
    return url; // 已经是嵌入地址，原样使用
}

// 试听窗口单独渲染：切换语言时只改标题，不重新加载播放器，正在播放的歌不会断
let playerKey = '';
function renderPlayer() {
    const slot = document.getElementById('playerSlot');
    const p = DATA.player || {};
    const embed = p.show ? toEmbed(p.url) : '';
    const key = embed + '|' + (p.height || '');
    if (!embed) { slot.innerHTML = ''; playerKey = ''; return; }
    if (key !== playerKey) {
        // 默认：宽屏展开，窄屏（手机）收起只露把手；访客手动开关过的话记住他的选择
        let closed = window.innerWidth < 1300;
        try { const s = localStorage.getItem('playerClosed'); if (s !== null) closed = s === '1'; } catch (e) {}
        slot.innerHTML = `
        <aside class="player${closed ? ' closed' : ''}" id="player">
            <div class="player-head">
                <span><i class="fa-solid fa-headphones"></i><span id="playerTitle"></span></span>
                <button class="player-close" onclick="togglePlayer()" title="收起"><i class="fa-solid fa-angles-left"></i></button>
            </div>
            <div class="player-body">
                <iframe src="${esc(embed)}" loading="lazy"
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
            </div>
            <div class="player-handle" onclick="togglePlayer()"><i class="fa-solid fa-headphones"></i><span id="playerHandleText"></span></div>
        </aside>`;
        playerKey = key;
    }
    document.getElementById('playerTitle').textContent = t(p.title);
    document.getElementById('playerHandleText').textContent = t(p.handle) || t(p.title);
}
function togglePlayer() {
    const closed = document.getElementById('player').classList.toggle('closed');
    try { localStorage.setItem('playerClosed', closed ? '1' : '0'); } catch (e) {}
}

document.querySelectorAll('.lang-nav button').forEach(btn => btn.addEventListener('click', () => {
    LANG = btn.dataset.lang;
    try { localStorage.setItem('lang', LANG); } catch (e) {}
    render();
}));

function start(data) {
    DATA = data;
    let saved = null;
    try { saved = localStorage.getItem('lang'); } catch (e) {}
    LANG = saved || data.defaultLang || 'en';
    render();
}

// 编辑器预览：从 editor.html 接收数据
window.addEventListener('message', e => {
    if (e.data && e.data.type === 'preview') {
        DATA = e.data.content;
        if (e.data.lang) LANG = e.data.lang;
        render();
    }
});

if (location.hash !== '#preview') {
    fetch('content.json', { cache: 'no-store' })
        .then(r => r.json())
        .then(start)
        .catch(() => {
            document.getElementById('main').innerHTML = '<div class="section">content.json 读取失败。请通过网站地址访问（直接双击打开本地文件无法读取）。</div>';
        });
}
</script>
</body>
</html>
